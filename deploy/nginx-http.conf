server {
    listen 80;
    listen [::]:80;
    server_name maconaria.dpdns.org cpaz25.maconaria.dpdns.org;

    root /var/www/maconaria/tenants/cpaz25/current;
    index index.html;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
