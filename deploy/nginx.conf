server {
    listen 80;
    listen [::]:80;
    server_name maconaria.dpdns.org cpaz25.maconaria.dpdns.org;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }

    location / {
        return 301 https://cpaz25.maconaria.dpdns.org$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name maconaria.dpdns.org;

    ssl_certificate /etc/letsencrypt/live/maconaria.dpdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/maconaria.dpdns.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://cpaz25.maconaria.dpdns.org$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name cpaz25.maconaria.dpdns.org;

    ssl_certificate /etc/letsencrypt/live/maconaria.dpdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/maconaria.dpdns.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/maconaria/tenants/cpaz25/current;
    index index.html;
    access_log /var/log/nginx/maconaria-cpaz25.access.log;
    error_log /var/log/nginx/maconaria-cpaz25.error.log;

    # Equivalente ao rewrite de arquivos existente no vercel.json.
    location = /functions/arquivo {
        proxy_pass https://loja-cavaleiros-da-paz.base44.app/functions/arquivo;
        proxy_set_header Host loja-cavaleiros-da-paz.base44.app;
        proxy_ssl_server_name on;
        proxy_ssl_name loja-cavaleiros-da-paz.base44.app;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 3;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
    }

    location = /index.html {
        expires -1;
    }

    location ~ /\. {
        deny all;
    }

    # Permite abrir e atualizar diretamente as rotas do React Router.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
